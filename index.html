<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานสถานะโปรเจกต์</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F7;--surface:#fff;--ink:#14212B;--muted:#586873;--line:#D9E0E5;--accent:#0E6E8C;--accent-ink:#fff;
--late:#B63A27;--late-bg:#FBE6E2;--risk:#8A5A00;--risk-bg:#FFF0CC;--prog:#0E6E8C;--prog-bg:#DFF0F6;--done:#1B8559;--done-bg:#E1F2E9;
--display:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;--body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E161B;--surface:#162128;--ink:#E6EDF1;--muted:#93A5B0;--line:#26353E;--accent:#52B6D6;--accent-ink:#0B1A21;
--late:#F08A78;--late-bg:#3A1C17;--risk:#F0C25C;--risk-bg:#38290A;--prog:#52B6D6;--prog-bg:#10303B;--done:#5CCB98;--done-bg:#15332A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body)}
.wrap{max-width:1040px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.5rem;line-height:1.25}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}.muted{color:var(--muted)}.small{font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.notice{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lbl{font-weight:500;font-size:.92rem}
input,textarea,select,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--late)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.7;cursor:default}
.spin{width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.pwrap{position:relative;display:flex}
.pwrap input{padding-right:78px}
.pwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:.85rem;font-weight:500;padding:6px 8px;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>input[type=text]{width:auto;flex:1 1 180px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--late);font-size:.92rem}
.login{max-width:380px;margin:12vh auto 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent;cursor:pointer;text-align:left;background:var(--surface);border-color:var(--line)}
.tile b{font:600 1.7rem/1.1 var(--display)}
.tile.on{outline:2px solid var(--accent)}
.late{color:var(--late);background:var(--late-bg)}.risk{color:var(--risk);background:var(--risk-bg)}.prog{color:var(--prog);background:var(--prog-bg)}.done{color:var(--done);background:var(--done-bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-size:.9rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:500}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.warn{color:var(--risk);font-size:.85rem}
.ok{color:var(--done);font-size:.85rem}
a{color:var(--accent)}
.cm{border-left:3px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.cm.need{border-left-color:var(--risk)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(560px,calc(100vw - 24px));max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:5px;position:relative;font-size:.92rem}
ul.tl li::before{content:'';position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label,.checks label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:400}
.radios input,.checks input{margin-right:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:calc(100vw - 24px)}
[hidden]{display:none!important}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="dlg"></dialog>
<script>
'use strict';
var API = 'https://script.google.com/macros/s/AKfycby4begLhepsjGOOdCxJ-J5DUfO7QPUDXlRhK5wu0HtidfZf-q85sfMo66-JU0QTB6OSgw/exec';
var ST = {
  delayed:{label:'ล่าช้า',cls:'late'},
  risk:{label:'มีความเสี่ยง',cls:'risk'},
  inprogress:{label:'กำลังดำเนินการ',cls:'prog'},
  done:{label:'เสร็จแล้ว',cls:'done'}
};
var ORDER = ['delayed','risk','inprogress','done'];
var STALE_DAYS = 14, MAX_IMG = 4;
var ROLE = {manager:'ผู้จัดการโปรเจกต์', owner:'เจ้าของบริษัท', admin:'ผู้ดูแลระบบ'};
var ERR = {dup:'ชื่อผู้ใช้นี้มีอยู่แล้ว', badid:'ชื่อผู้ใช้ใช้ได้เฉพาะตัวอักษรอังกฤษพิมพ์เล็กและตัวเลข ยาว 3–20 ตัว', missing:'กรอกข้อมูลไม่ครบ', short:'รหัสสั้นเกินไป (อย่างน้อย 6 ตัว)', state:'สถานะเปลี่ยนไปแล้ว รีเฟรชดู', role:'ไม่มีสิทธิ์ทำรายการนี้', notfound:'ไม่พบรายการ'};
var S = {token:null, id:null, name:null, role:null, projects:[], invites:[], managers:[], people:[], filterStatus:'', filterMgr:''};
var imgCache = {}, imgQueue = [], imgActive = 0;

function $(s, r){ return (r || document).querySelector(s); }
function h(tag, attrs){
  var el = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function(k){
    var v = attrs[k];
    if(k === 'text') el.textContent = v;
    else if(k === 'class') el.className = v;
    else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) el.setAttribute(k, v);
  });
  for(var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if(c == null || c === false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x) el.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
    else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(function(){ t.hidden = true; }, 3600);
}
function fmt(iso){
  if(!iso) return '-';
  var d = new Date(iso); if(isNaN(d)) return '-';
  return d.toLocaleString('th-TH', {day:'numeric', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function ageDays(iso){ var d = new Date(iso); return isNaN(d) ? 0 : Math.floor((Date.now() - d.getTime()) / 86400000); }
function mapUrl(loc){ return 'https://www.google.com/maps?q=' + encodeURIComponent(loc.lat + ',' + loc.lng); }
function keyOf(p){ return ST[p.status] ? p.status : 'inprogress'; }
function errText(j, fallback){ return (j && ERR[j.error]) || fallback; }

/* Shows a spinner in the button and blocks double clicks while fn runs. */
async function withBusy(btn, label, fn){
  if(btn.disabled) return;
  var orig = Array.prototype.slice.call(btn.childNodes);
  btn.disabled = true;
  btn.replaceChildren(h('span', {class:'spin', 'aria-hidden':'true'}), label);
  try{ return await fn(); }
  finally{ if(btn.isConnected){ btn.disabled = false; btn.replaceChildren.apply(btn, orig); } }
}

/* ---------- API ---------- */
async function call(body){
  if(S.token) body.token = S.token;
  var res = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  var j = await res.json();
  if(!j.ok && j.error === 'auth' && body.action !== 'login'){ logoutLocal(); toast('หมดเวลาการเข้าสู่ระบบ หรือบัญชีถูกเปลี่ยน กรุณาเข้าใหม่'); }
  return j;
}
function saveSession(){ try{ sessionStorage.setItem('ps-s', JSON.stringify({token:S.token, id:S.id, name:S.name, role:S.role})); }catch(e){} }
function logoutLocal(){ S.token = null; S.id = null; S.name = null; S.role = null; try{ sessionStorage.removeItem('ps-s'); }catch(e){} render(); }
function closeDlg(){ var d = $('#dlg'); if(d.open) d.close(); }

/* ---------- password field with show/hide ---------- */
function pwField(attrs){
  var input = h('input', Object.assign({type:'password'}, attrs));
  var btn = h('button', {type:'button', 'aria-pressed':'false', 'aria-label':'แสดงรหัสที่พิมพ์', text:'แสดง', onclick:function(){
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'ซ่อน' : 'แสดง';
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    btn.setAttribute('aria-label', show ? 'ซ่อนรหัส' : 'แสดงรหัสที่พิมพ์');
  }});
  return {el:h('div', {class:'pwrap'}, input, btn), input:input};
}
function cleanId(input){ input.addEventListener('input', function(){ var v = input.value.toLowerCase().replace(/[^a-z0-9]/g, ''); if(v !== input.value) input.value = v; }); }

/* ---------- images (served through the API, loaded a few at a time) ---------- */
function loadImg(id, cb){
  if(imgCache[id]){ cb(imgCache[id]); return; }
  imgQueue.push({id:id, cb:cb}); pumpImgs();
}
function pumpImgs(){
  while(imgActive < 3 && imgQueue.length){
    var job = imgQueue.shift(); imgActive++;
    (function(job){
      call({action:'img', id:job.id}).then(function(j){ if(j.ok){ imgCache[job.id] = j.data; job.cb(j.data); } })
        .catch(function(){}).then(function(){ imgActive--; pumpImgs(); });
    })(job);
  }
}
function thumbEl(id, removable, onRemove){
  var img = h('img', {alt:'รูปโปรเจกต์', loading:'lazy'});
  var box = h('div', {class:'thumb', onclick:function(){ if(img.src) showImage(img.src); }}, img);
  loadImg(id, function(src){ img.src = src; });
  if(removable) box.appendChild(h('button', {class:'x', type:'button', 'aria-label':'ลบรูป', text:'×', onclick:function(e){ e.stopPropagation(); onRemove(); }}));
  return box;
}
function showImage(src){
  var d = $('#dlg'); d.replaceChildren(h('img', {src:src, alt:'', style:'width:100%;border-radius:8px'}), h('div', {class:'row', style:'margin-top:12px'}, h('button', {class:'btn', text:'ปิด', onclick:closeDlg})));
  d.showModal();
}
function resize(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onerror = reject;
    r.onload = function(){
      var im = new Image();
      im.onerror = reject;
      im.onload = function(){
        var s = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* ---------- render ---------- */
function render(){
  var app = $('#app'); app.replaceChildren();
  if(!S.token){ app.appendChild(loginView()); return; }
  app.appendChild(h('div', {class:'bar'},
    h('div', {}, h('h1', {text:'รายงานสถานะโปรเจกต์'}), h('p', {class:'muted small', text:S.role === 'owner' ? 'เจ้าของบริษัท' : S.name + ' · ' + (ROLE[S.role] || '')})),
    h('div', {class:'row'},
      S.role !== 'admin' ? (function(){ var b = h('button', {class:'btn', text:'รีเฟรช'}); b.addEventListener('click', function(){ withBusy(b, 'กำลังโหลด...', refresh); }); return b; })() : null,
      h('button', {class:'btn', text:'ออกจากระบบ', onclick:function(){ call({action:'logout'}).catch(function(){}); logoutLocal(); }}))));
  if(S.role === 'admin') app.appendChild(adminView());
  else if(S.role === 'owner') app.appendChild(ownerView());
  else app.appendChild(managerView());
}

function loginView(){
  var user = h('input', {type:'text', id:'ln', autocomplete:'username', autocapitalize:'none', autocorrect:'off', spellcheck:'false', placeholder:'เช่น somchai'});
  cleanId(user);
  var pw = pwField({id:'lp', autocomplete:'current-password'});
  var err = h('p', {class:'err', role:'alert'});
  var btn = h('button', {class:'btn primary', type:'submit', text:'เข้าสู่ระบบ'});
  var f = h('form', {class:'card login', onsubmit:function(e){
    e.preventDefault(); err.textContent = '';
    withBusy(btn, 'กำลังเข้าสู่ระบบ...', async function(){
      try{
        var j = await call({action:'login', username:user.value.trim(), pass:pw.input.value});
        if(j.ok){ S.token = j.token; S.id = j.id; S.name = j.name; S.role = j.role; saveSession(); await refresh(); }
        else err.textContent = j.error === 'locked' ? 'ใส่รหัสผิดหลายครั้ง ลองใหม่ใน 15 นาที' : 'ชื่อผู้ใช้หรือรหัสไม่ถูกต้อง';
      }catch(x){ err.textContent = 'เชื่อมต่อไม่ได้ ลองอีกครั้ง'; }
    });
  }},
    h('h1', {text:'รายงานสถานะโปรเจกต์'}), h('p', {class:'muted', text:'เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสของคุณ'}),
    h('div', {class:'field'}, h('label', {for:'ln', text:'ชื่อผู้ใช้ (ภาษาอังกฤษ)'}), user),
    h('div', {class:'field'}, h('label', {for:'lp', text:'รหัส'}), pw.el), err, btn);
  return f;
}

async function refresh(){
  if(S.role === 'admin'){ var a = await call({action:'people'}); if(a.ok) S.people = a.people; render(); return; }
  var j = await call({action:'list'});
  if(j.ok){ S.projects = j.projects; S.invites = j.invites; S.managers = j.managers; S.name = j.me.name; saveSession(); }
  else if(j.error !== 'auth') toast('โหลดข้อมูลไม่สำเร็จ');
  render();
}

/* generic action button: confirms nothing, shows spinner, refreshes after success */
function actBtn(label, cls, busyLabel, fn){
  var b = h('button', {class:'btn ' + cls, type:'button', text:label});
  b.addEventListener('click', function(){ withBusy(b, busyLabel, async function(){
    try{ var j = await fn(); if(j && !j.ok) toast(errText(j, 'ทำรายการไม่สำเร็จ')); else await refresh(); }
    catch(x){ toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง'); }
  }); });
  return b;
}

/* ---------- shared project card ---------- */
var EVT = {
  create:function(e){ return 'สร้างโปรเจกต์'; },
  status:function(e){ return ST[e.status] ? ST[e.status].label : e.status; },
  'approval-request':function(){ return 'ส่งขออนุมัติจากเจ้าของบริษัท'; },
  approved:function(){ return 'เจ้าของบริษัทอนุมัติ'; },
  returned:function(e){ return 'เจ้าของบริษัทส่งกลับให้แก้: ' + e.note; },
  'co-invite':function(e){ return 'ขอให้ ' + e.note + ' ร่วมรับผิดชอบ'; },
  'co-remove':function(e){ return 'ถอด ' + e.note + ' ออกจากผู้ร่วมรับผิดชอบ'; },
  'co-accepted':function(){ return 'รับทราบการร่วมรับผิดชอบ'; },
  'co-declined':function(){ return 'ปฏิเสธการร่วมรับผิดชอบ'; },
  transfer:function(e){ return 'โอนชื่อผู้รับผิดชอบ ' + e.note; }
};
function approvalBadge(p){
  var a = p.approval || {};
  if(a.state === 'pending') return h('span', {class:'badge risk', text:'รอเจ้าของบริษัทอนุมัติ'});
  if(a.state === 'approved') return h('span', {class:'badge done', text:'อนุมัติแล้ว ' + fmt(a.at)});
  if(a.state === 'returned') return h('span', {class:'badge late', text:'ส่งกลับให้แก้'});
  return null;
}
function coText(c){ return c.name + ({accepted:' (รับทราบแล้ว)', pending:' (รอรับทราบ)', declined:' (ปฏิเสธ)'}[c.state] || ''); }

function commentEl(p, c){
  return h('div', {class:'cm' + (c.needsMyAck ? ' need' : '')},
    h('p', {class:'small muted', text:c.author + ' · ' + fmt(c.at)}),
    h('p', {text:c.text}),
    h('p', {class:'small ' + (c.waiting.length ? 'warn' : 'ok'), text:(c.acks.length ? 'รับทราบแล้ว: ' + c.acks.map(function(a){ return a.name; }).join(', ') : 'ยังไม่มีผู้รับทราบ') + (c.waiting.length ? ' · รอ: ' + c.waiting.join(', ') : '')}),
    c.needsMyAck ? actBtn('รับทราบ', 'sm primary', 'กำลังบันทึก...', function(){ return call({action:'ack', cid:c.cid}); }) : null);
}

function projectCard(p, mine){
  var k = keyOf(p), stale = k !== 'done' && ageDays(p.updatedAt) > STALE_DAYS, a = p.approval || {};
  var cards = [
    h('div', {class:'row', style:'justify-content:space-between'}, h('h3', {text:p.name}), h('span', {class:'badge ' + ST[k].cls, text:ST[k].label})),
    approvalBadge(p) ? h('div', {class:'row'}, approvalBadge(p), a.state === 'approved' && a.editedAfter ? h('span', {class:'warn', text:'แก้ไขหลังอนุมัติ'}) : null) : null,
    a.state === 'returned' && a.note ? h('p', {class:'warn', text:'เหตุผลที่ส่งกลับ: ' + a.note}) : null,
    h('div', {class:'meter', role:'progressbar', 'aria-valuenow':p.progress, 'aria-valuemin':0, 'aria-valuemax':100, 'aria-label':'ความคืบหน้า'}, h('i', {style:'width:' + p.progress + '%'})),
    h('p', {class:'small muted', text:'ความคืบหน้า ' + p.progress + '% · โดย ' + p.ownerName + (mine && !p.isCreator ? ' (โปรเจกต์ร่วม)' : '')}),

  var box = h('div', {style:'display:flex;flex-direction:column;gap:14px'});
  box.appendChild(h('h2', {text:'จัดการชื่อและรหัส'}));
  box.appendChild(h('p', {class:'muted small', text:'ชื่อผู้ใช้ = ใช้เข้าสู่ระบบ (อังกฤษพิมพ์เล็กและตัวเลข 3–20 ตัว) ชื่อที่แสดง = ชื่อไทยที่คนเห็นในโปรเจกต์ การแก้ชื่อที่แสดงไม่เปลี่ยนชื่อในโปรเจกต์ที่สร้างไปแล้ว ถ้าแก้ชื่อผู้ใช้ของใคร คนนั้นต้องเข้าสู่ระบบใหม่ด้วยชื่อใหม่ รหัสไม่เก็บตัวจริง ดูรหัสเดิมไม่ได้ ตั้งใหม่ได้เท่านั้น (อย่างน้อย 6 ตัว)'}));
  var rows = S.people.map(function(p){
    var uid = h('input', {type:'text', value:p.id, maxlength:20, 'aria-label':'ชื่อผู้ใช้ของ ' + p.name, autocapitalize:'none', style:'min-width:110px'}); cleanId(uid);
    var nm = h('input', {type:'text', value:p.name, maxlength:60, 'aria-label':'ชื่อที่แสดงของ ' + p.id, style:'min-width:120px'});
    var saveName = h('button', {class:'btn sm', type:'button', text:'บันทึกชื่อ'});
    saveName.addEventListener('click', function(){
      withBusy(saveName, 'กำลังบันทึก...', async function(){
        var j = await call({action:'updatePerson', id:p.id, newId:uid.value, newName:nm.value});
        if(j.ok){ toast('บันทึกชื่อแล้ว'); if(p.id === S.id && uid.value !== p.id){ logoutLocal(); toast('เปลี่ยนชื่อผู้ใช้ของคุณแล้ว กรุณาเข้าสู่ระบบใหม่'); } else await refresh(); }
        else toast(errText(j, 'บันทึกชื่อไม่สำเร็จ'));
      });
    });
    var pw = pwField({placeholder:'ตั้งรหัสใหม่', autocomplete:'new-password', 'aria-label':'รหัสใหม่ของ ' + p.name, style:'min-width:150px'});
    var savePw = h('button', {class:'btn sm', type:'button', text:'บันทึกรหัส'});
    savePw.addEventListener('click', function(){
      if(pw.input.value.length < 6){ toast(ERR.short); return; }
      withBusy(savePw, 'กำลังบันทึก...', async function(){
        var j = await call({action:'setPass', id:p.id, pass:pw.input.value});
        if(j.ok){ pw.input.value = ''; toast('ตั้งรหัสของ ' + p.name + ' แล้ว'); await refresh(); } else toast(errText(j, 'ตั้งรหัสไม่สำเร็จ'));
      });
    });
    return h('tr', {},
      h('td', {}, h('div', {class:'field'}, uid, nm, saveName)),
      h('td', {text:ROLE[p.role] || p.role}),
      h('td', {text:p.hasPass ? 'ตั้งแล้ว' : 'ยังไม่ตั้ง', class:p.hasPass ? '' : 'warn'}),
      h('td', {}, h('div', {class:'field'}, pw.el, savePw)),
      h('td', {}, p.role === 'admin' ? null : (function(){
        var b = h('button', {class:'btn sm', type:'button', text:p.active ? 'ปิดการใช้งาน' : 'เปิดการใช้งาน'});
        b.addEventListener('click', function(){ withBusy(b, 'กำลังบันทึก...', async function(){ var j = await call({action:'setActive', id:p.id, active:!p.active}); if(j.ok) await refresh(); else toast(errText(j, 'ไม่สำเร็จ')); }); });
        return b;
      })()));
  });
  box.appendChild(h('div', {class:'card', style:'overflow-x:auto'}, h('table', {}, h('thead', {}, h('tr', {}, ['ชื่อผู้ใช้ / ชื่อที่แสดง','บทบาท','รหัส','ตั้งรหัสใหม่','สถานะ'].map(function(t){ return h('th', {text:t}); }))), h('tbody', {}, rows))));
  var nu = h('input', {type:'text', maxlength:20, placeholder:'ชื่อผู้ใช้ (อังกฤษ)', 'aria-label':'ชื่อผู้ใช้ใหม่', autocapitalize:'none'}); cleanId(nu);
  var nn = h('input', {type:'text', maxlength:60, placeholder:'ชื่อที่แสดง (ไทย)', 'aria-label':'ชื่อที่แสดงของผู้จัดการใหม่'});
  var add = h('button', {class:'btn primary', type:'button', text:'เพิ่ม'});
  add.addEventListener('click', function(){
    if(!nu.value || !nn.value.trim()){ toast(ERR.missing); return; }
    withBusy(add, 'กำลังเพิ่ม...', async function(){
      var j = await call({action:'addPerson', username:nu.value, name:nn.value});
      if(j.ok){ nu.value = ''; nn.value = ''; toast('เพิ่มแล้ว ตั้งรหัสในตารางด้านบน'); await refresh(); } else toast(errText(j, 'ไม่สำเร็จ'));
    });
  });
  box.appendChild(h('div', {class:'card'}, h('h3', {text:'เพิ่มผู้จัดการ'}), h('div', {class:'row'}, nu, nn, add)));
  return box;
}

/* ---------- start ---------- */
(function(){
  try{
    var s = JSON.parse(sessionStorage.getItem('ps-s') || 'null');
    if(s && s.token){ S.token = s.token; S.id = s.id; S.name = s.name; S.role = s.role; refresh(); return; }
  }catch(e){}
  render();
})();
</script>
</body>
</html>
