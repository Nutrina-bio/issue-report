<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายงานสถานะโปรเจกต์</title>
<!-- home-screen app: manifest + icons live next to this file in the Pages repo (see README) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#557F52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="รายงานโปรเจกต์">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Natural palette: light sage green + light brown on warm cream. Status colours stay distinct (terracotta / amber / brown / green). */
:root{--bg:#F6F2EA;--surface:#FFFDF8;--surface-2:#F0EADF;--ink:#35302A;--muted:#7A7064;--line:#E5DDCF;
--accent:#557F52;--accent-ink:#fff;--accent-soft:#E4EDDD;--brown:#9C7A55;--brown-soft:#F0E5D6;
--late:#B04E37;--late-bg:#F7E3DA;--risk:#8A6216;--risk-bg:#F5EAD2;--prog:#7D5E3C;--prog-bg:#EFE4D4;--done:#3E7A4D;--done-bg:#DFEDDD;
--shadow:0 1px 2px rgba(70,55,35,.05),0 4px 14px rgba(70,55,35,.06);--shadow-hi:0 2px 4px rgba(70,55,35,.06),0 12px 28px rgba(70,55,35,.10);
--r:14px;--ease:cubic-bezier(.22,.8,.32,1);
--display:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;--body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1B1A16;--surface:#24221D;--surface-2:#2C2923;--ink:#ECE5D8;--muted:#A89D8E;--line:#3A362E;
--accent:#9EC49B;--accent-ink:#1B1A16;--accent-soft:#26331F;--brown:#CFB28D;--brown-soft:#352C21;
--late:#E79A84;--late-bg:#3B2620;--risk:#E3C27E;--risk-bg:#372C16;--prog:#D4B68E;--prog-bg:#33291D;--done:#93CC9D;--done-bg:#1F3324;
--shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.2);--shadow-hi:0 2px 4px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.005em}
h1{font-size:1.45rem;line-height:1.25}h2{font-size:1.12rem}h3{font-size:1rem}
p{margin:0}.muted{color:var(--muted)}.small{font-size:.85rem}
.greet{font-size:.95rem;margin-top:2px}
.enter .greet{animation:rise .5s var(--ease) both .1s}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.card.notice{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lbl{font-weight:500;font-size:.92rem}
input,textarea,select,button{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;transition:border-color .2s,background .2s,box-shadow .2s}
input[type=date]{background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:9px 12px}
input[type=text]:focus,input[type=password]:focus,input[type=number]:focus,input[type=date]:focus,textarea:focus,select:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
textarea{min-height:96px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,border-color .2s,box-shadow .2s,transform .12s}
.btn:hover:not(:disabled){border-color:var(--brown);background:var(--brown-soft)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 1px 2px rgba(60,90,55,.25)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.07);box-shadow:0 4px 12px rgba(60,90,55,.25)}
.btn.danger{color:var(--late)}
.btn.danger:hover:not(:disabled){border-color:var(--late);background:var(--late-bg)}
.btn.sm{padding:5px 12px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.65;cursor:default}
.spin{width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.pwrap{position:relative;display:flex}
.pwrap input{padding-right:78px}
.pwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:.85rem;font-weight:500;padding:6px 8px;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>input[type=text]{width:auto;flex:1 1 180px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{position:relative;border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;color:var(--muted);border-radius:10px 10px 0 0;transition:color .2s,background .2s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{color:var(--ink)}
.tab::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transform:scaleX(0);transition:transform .3s var(--ease)}
.tab.on::after{transform:scaleX(1)}
.dot{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--late);color:#fff;font-size:.75rem;font-weight:600;line-height:20px;text-align:center}
.cnt{font-size:.8rem;font-weight:400;color:var(--muted)}
.cmtog{align-self:flex-start;text-align:left}
.dim{opacity:.65}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--late);font-size:.92rem}
.login{max-width:380px;margin:12vh auto 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);cursor:pointer;text-align:left;background:var(--surface);box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.tile b{font:600 1.7rem/1.1 var(--display)}
.tile.on{outline:2px solid var(--accent);outline-offset:2px}
.late{color:var(--late);background:var(--late-bg)}.risk{color:var(--risk);background:var(--risk-bg)}.prog{color:var(--prog);background:var(--prog-bg)}.done{color:var(--done);background:var(--done-bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-size:.9rem;transition:background .2s,border-color .2s}
.chip:hover{background:var(--brown-soft);border-color:var(--brown)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.withside{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.withside > .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.side{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.side h3{font-size:.8rem;padding:4px 8px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left;font-size:.92rem;transition:background .2s,transform .15s var(--ease)}
.side button:hover{background:var(--surface-2);transform:translateX(2px)}
.side button.on{background:var(--accent-soft)}
.side button b{min-width:28px;text-align:center;padding:1px 8px;border-radius:999px;background:var(--surface-2);font-size:.85rem}
.side button.late b{background:var(--late-bg);color:var(--late)}
.side button.risk b{background:var(--risk-bg);color:var(--risk)}
.side button.zero{color:var(--muted)}
.side button.zero b{background:none;color:var(--muted)}
@media (max-width:760px){.withside{grid-template-columns:1fr}.side{position:static;flex-direction:row;flex-wrap:wrap;gap:6px}.side h3{width:100%;padding:0 4px}.side button{border:1px solid var(--line);padding:6px 10px}}
.alertbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--late-bg);color:var(--late);border:1px solid color-mix(in srgb,var(--late) 35%,transparent);border-radius:var(--r);padding:12px 16px;font-weight:500}
.alertbar .btn{flex:none}
.latelist{display:flex;flex-direction:column;gap:8px}
.lateitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.lateitem .pn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline}
.lateitem .meta{grid-column:1/-1}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:500}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--brown)));transform-origin:left}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.problem .cm{border-left-color:var(--late);background:var(--late-bg);border-radius:0 6px 6px 0;padding:6px 10px}
.ask{flex-basis:100%;width:100%;border:1px solid var(--late);background:var(--late-bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.files{display:flex;flex-wrap:wrap;gap:6px}
#dlg.wide{width:min(960px,calc(100vw - 32px));max-width:none}
.fpv{display:flex;flex-direction:column;gap:12px}
.fpv-name{font-size:16px;overflow-wrap:anywhere}
.fpv-body{min-height:80px}
.fpv-img{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:8px}
.fpv-frame{width:100%;height:75vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.fpv-text{max-height:70vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:0}
.files:empty{display:none}
.filechip{display:inline-flex;align-items:center;gap:2px;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.filechip .file{border:0;background:none;color:inherit;font:inherit;font-size:13px;padding:6px 8px;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.filechip .file:hover{text-decoration:underline}
.filechip .x{border:0;background:none;color:inherit;cursor:pointer;width:28px;height:28px;font-size:16px;line-height:1}
.warn{color:var(--risk);font-size:.85rem}
.ok{color:var(--done);font-size:.85rem}
a{color:var(--accent)}
.cm{border-left:3px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.cm.need{border-left-color:var(--risk)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:90vh;box-shadow:0 24px 60px rgba(40,30,15,.25)}
dialog::backdrop{background:rgba(45,38,28,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
dialog.big{width:min(920px,calc(100vw - 24px));max-height:92vh;min-height:min(560px,92vh);padding:0}
.pd-head{position:sticky;top:0;z-index:1;background:var(--surface);padding:16px 18px 0;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.pd-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:12px}
.card.click{cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.card.click:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steprow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.steprow > .checks,.steprow > label{grid-column:2 / 4}
@media (max-width:640px){.steprow{grid-template-columns:auto 1fr}.steprow > *{grid-column:2}.steprow > b{grid-column:1}}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.steps li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
ol.steps li.cur{border-color:var(--accent);background:var(--accent-soft)}
ol.steps li.done{opacity:.8}
.cover{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--line)}
ul.tl{list-style:none;margin:0;padding:0}
ul.tl li{padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:5px;position:relative;font-size:.92rem}
ul.tl li::before{content:'';position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label,.checks label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:400;transition:background .2s,border-color .2s}
.radios label:has(input:checked),.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.radios input,.checks input{accent-color:var(--accent)}
.radios input,.checks input{margin-right:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:9;max-width:calc(100vw - 24px);box-shadow:var(--shadow-hi)}
[hidden]{display:none!important}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* ---------- soft motion ----------
   Entry animations run only when the view changes (render() adds .enter to #app once), not on every refresh.
   Everything is switched off for people who ask their device for less motion. */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.enter .cards > .card,.enter .tiles > .tile,.enter .latelist > .lateitem,.enter .card.notice{animation:rise .45s var(--ease) both}
.enter .cards > .card:nth-child(2),.enter .tiles > .tile:nth-child(2),.enter .latelist > :nth-child(2){animation-delay:.04s}
.enter .cards > .card:nth-child(3),.enter .tiles > .tile:nth-child(3),.enter .latelist > :nth-child(3){animation-delay:.08s}
.enter .cards > .card:nth-child(4),.enter .tiles > .tile:nth-child(4),.enter .latelist > :nth-child(4){animation-delay:.12s}
.enter .cards > .card:nth-child(5),.enter .tiles > .tile:nth-child(5),.enter .latelist > :nth-child(5){animation-delay:.16s}
.enter .cards > .card:nth-child(n+6),.enter .tiles > .tile:nth-child(n+6),.enter .latelist > :nth-child(n+6){animation-delay:.2s}
.enter .side,.enter .alertbar,.enter .bar,.enter .tabs{animation:fade .4s ease both}
.enter .meter i,#pd.opening .meter i{animation:fill .8s var(--ease) both .1s}
dialog[open]{animation:pop .28s var(--ease)}
dialog[open]::backdrop{animation:fade .25s ease}
.toast:not([hidden]){animation:toastIn .3s var(--ease)}
.ask{animation:rise .25s var(--ease)}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after,dialog::backdrop{animation:none!important;transition:none!important}
  .card.click:hover,.tile:hover{transform:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="pd" class="big" aria-label="รายละเอียดโปรเจกต์"></dialog>
<dialog id="dlg"></dialog>
<script>
'use strict';
var API = 'https://uakdqyrczqnkjqxarqao.supabase.co/functions/v1/api';
var ST = {
  delayed:{label:'ล่าช้า',cls:'late'},
  inprogress:{label:'กำลังดำเนินการ',cls:'prog'},
  done:{label:'เสร็จสิ้น',cls:'done'}
};
var ORDER = ['delayed','inprogress','done'];
var STALE_DAYS = 7, MAX_IMG = 4;
var ROLE = {manager:'ผู้จัดการโปรเจกต์', owner:'เจ้าของบริษัท', admin:'ผู้ดูแลระบบ'};

function $(s, r){ return (r || document).querySelector(s); }
function h(tag, attrs){
  var el = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function(k){
    var v = attrs[k];
    if(k === 'text') el.textContent = v;
    else if(k === 'class') el.className = v;
    else if(k.slice(0,2) === 'on') el.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) el.setAttribute(k, v);
  });
  for(var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if(c == null || c === false) continue;
    (function add(x){ // children may be nested arrays
      if(x == null || x === false || x === '') return;
      if(Array.isArray(x)) x.forEach(add);
      else el.appendChild(typeof x === 'string' ? document.createTextNode(x) : x);
    })(c);
  }
  return el;
}
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(function(){ t.hidden = true; }, 3600);
}
function fmt(iso){
  if(!iso) return '-';
  var d = new Date(iso); if(isNaN(d)) return '-';
  return d.toLocaleString('th-TH', {day:'numeric', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function ageDays(iso){ var d = new Date(iso); return isNaN(d) ? 0 : Math.floor((Date.now() - d.getTime()) / 86400000); }

/* Shows a spinner in the button and blocks double clicks while fn runs. */
async function withBusy(btn, label, fn){
  if(btn.disabled) return;
  var orig = Array.prototype.slice.call(btn.childNodes);
  btn.disabled = true;
  btn.replaceChildren(h('span', {class:'spin', 'aria-hidden':'true'}), label);
  try{ return await fn(); }
  finally{ if(btn.isConnected){ btn.disabled = false; btn.replaceChildren.apply(btn, orig); } }
}

/* ---------- images (the API returns a data URL or a signed link that expires after 1 hour; loaded a few at a time) ---------- */
var IMG_TTL = 50 * 60 * 1000;
function loadImg(id, cb){
  var c = imgCache[id];
  if(c && Date.now() - c.t < IMG_TTL){ cb(c.d); return; }
  imgQueue.push({id:id, cb:cb}); pumpImgs();
}
function pumpImgs(){
  while(imgActive < 3 && imgQueue.length){
    var job = imgQueue.shift(); imgActive++;
    (function(job){
      call({action:'img', id:job.id}).then(function(j){ if(j.ok){ imgCache[job.id] = {d:j.data, t:Date.now()}; job.cb(j.data); } })
        .catch(function(){}).then(function(){ imgActive--; pumpImgs(); });
    })(job);
  }
}
function thumbEl(id, removable, onRemove){

  loadImg(id, function(src){ img.src = src; });
  if(removable) box.appendChild(h('button', {class:'x', type:'button', 'aria-label':'ลบรูป', text:'×', onclick:function(e){ e.stopPropagation(); onRemove(); }}));
  return box;
}

var MAX_FILES = 5, MAX_FILE_MB = 4, FILE_EXT = ['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','zip','jpg','jpeg','png'];
function sizeText(n){ return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

/* preview in a pop-up: PDF, photos, TXT and CSV are shown; other types show name, size and the download button */
function fileKind(name){
  var ext = (/\.([a-z0-9]+)$/i.exec(name || '') || ['', ''])[1].toLowerCase();
  return /^(jpe?g|png)$/.test(ext) ? 'image' : ext === 'pdf' ? 'pdf' : /^(txt|csv)$/.test(ext) ? 'text' : '';
}
function previewFile(f){
  var d = $('#dlg'), kind = fileKind(f.name), body = h('div', {class:'fpv-body'});
  var dl = h('button', {class:'btn primary', type:'button', text:'ดาวน์โหลด'}); dl.addEventListener('click', function(){ openFile(f, dl); });
  d.replaceChildren(h('div', {class:'fpv'},
    h('div', {class:'row', style:'justify-content:space-between;flex-wrap:nowrap;gap:8px'},
      h('div', {style:'min-width:0'}, h('h2', {class:'fpv-name', text:f.name}), h('p', {class:'small muted', text:f.size ? sizeText(f.size) : ''})),
      h('div', {class:'row', style:'flex:none'}, dl, h('button', {class:'btn', type:'button', text:'ปิด', onclick:closeDlg}))),
    body));
  d.classList.add('wide'); d.addEventListener('close', function un(){ d.classList.remove('wide'); d.removeEventListener('close', un); });
  d.showModal();
  if(!kind){ body.appendChild(h('p', {class:'muted', text:'ไฟล์ชนิดนี้เปิดดูบนหน้าเว็บไม่ได้ กด "ดาวน์โหลด" เพื่อเปิดในเครื่อง'})); return; }
  body.appendChild(h('p', {class:'muted', text:'กำลังโหลด...'}));
  call({action:'file', id:f.id, inline:true}).then(async function(j){
    if(!j.ok){ body.replaceChildren(h('p', {class:'err', text:errText(j, 'เปิดไฟล์ไม่ได้')})); return; }
    if(kind === 'image') body.replaceChildren(h('img', {src:j.data, alt:f.name, class:'fpv-img'}));
    else if(kind === 'pdf') body.replaceChildren(h('iframe', {src:j.data, title:f.name, class:'fpv-frame'}));
    else {
      var t = await (await fetch(j.data)).text();
      body.replaceChildren(h('pre', {class:'fpv-text', text:t.length > 200000 ? t.slice(0, 200000) + '\n… (แสดงแค่ส่วนต้น ดาวน์โหลดเพื่อดูทั้งไฟล์)' : t}));
    }
  }).catch(function(){ body.replaceChildren(h('p', {class:'err', text:'เปิดไฟล์ไม่ได้ ลองกดดาวน์โหลด'})); });
}
function fileChip(f, onRemove){
  var b = h('button', {class:'file', type:'button', title:f.name, text:'📎 ' + f.name + (f.size ? ' (' + sizeText(f.size) + ')' : '')});
  if(!onRemove) b.addEventListener('click', function(){ previewFile(f); });
  return h('span', {class:'filechip'}, b, onRemove ? h('button', {class:'x', type:'button', 'aria-label':'ลบไฟล์ ' + f.name, text:'×', onclick:onRemove}) : null);
}
function filesEl(files){ return files && files.length ? h('div', {class:'files'}, files.map(function(f){ return fileChip(f, null); })) : null; }
/* text, photos and files of a work report (task or step) */
function reportView(r, head){
  if(!r) return null;
  return h('div', {class:'cm'}, head ? h('p', {class:'small muted', text:head}) : null, r.text ? h('p', {class:'small', text:r.text}) : null,
    r.images && r.images.length ? h('div', {class:'thumbs'}, r.images.map(function(id){ return thumbEl(id, false); })) : null, filesEl(r.files));

function readB64(file){
  return new Promise(function(resolve, reject){ var r = new FileReader(); r.onerror = reject; r.onload = function(){ resolve(String(r.result).split(',')[1] || ''); }; r.readAsDataURL(file); });
}
/* photo and file pickers for a report; .images and .files hold what was uploaded */
function attachBox(init){
  var box = {images:init && init.images ? init.images.slice() : [], files:init && init.files ? init.files.slice() : []};
  var thumbs = h('div', {class:'thumbs'}), flist = h('div', {class:'files'});
  function draw(){
    thumbs.replaceChildren.apply(thumbs, box.images.map(function(id, i){ return thumbEl(id, true, function(){ box.images.splice(i, 1); draw(); }); }));
    flist.replaceChildren.apply(flist, box.files.map(function(f, i){ return fileChip(f, function(){ box.files.splice(i, 1); draw(); }); }));
  }
  var imgIn = h('input', {type:'file', accept:'image/*', multiple:true, hidden:true, class:'att-img'});
  var fileIn = h('input', {type:'file', accept:FILE_EXT.map(function(e){ return '.' + e; }).join(','), multiple:true, hidden:true, class:'att-file'});
  var pickImg = h('button', {class:'btn sm', type:'button', text:'แนบรูป', onclick:function(){ imgIn.click(); }});
  var pickFile = h('button', {class:'btn sm', type:'button', text:'แนบไฟล์', onclick:function(){ fileIn.click(); }});
  imgIn.addEventListener('change', function(){
    var list = Array.prototype.slice.call(imgIn.files); imgIn.value = '';
    withBusy(pickImg, 'กำลังอัปโหลด...', async function(){
      for(var i = 0; i < list.length; i++){
        if(box.images.length >= MAX_IMG){ toast('แนบรูปได้ไม่เกิน ' + MAX_IMG + ' รูป'); break; }
        try{ var b64 = await resize(list[i]); var j = await call({action:'upload', data:b64});
          if(j.ok){ imgCache[j.id] = {d:'data:image/jpeg;base64,' + b64, t:Date.now()}; box.images.push(j.id); draw(); } else toast('อัปโหลดรูปไม่สำเร็จ');
        }catch(x){ toast('อัปโหลดรูปไม่สำเร็จ'); }
      }
    });
  });
  fileIn.addEventListener('change', function(){
    var list = Array.prototype.slice.call(fileIn.files); fileIn.value = '';
    withBusy(pickFile, 'กำลังอัปโหลด...', async function(){
      for(var i = 0; i < list.length; i++){
        var f = list[i], ext = (/\.([a-z0-9]+)$/i.exec(f.name) || ['', ''])[1].toLowerCase();
        if(box.files.length >= MAX_FILES){ toast('แนบไฟล์ได้ไม่เกิน ' + MAX_FILES + ' ไฟล์'); break; }
        if(FILE_EXT.indexOf(ext) < 0){ toast(ERR.filetype); continue; }
        if(f.size > MAX_FILE_MB * 1048576){ toast(f.name + ': ' + ERR.filesize); continue; }
        try{ var j = await call({action:'uploadFile', name:f.name, data:await readB64(f)});
          if(j.ok){ box.files.push(j.file); draw(); } else toast(f.name + ': ' + errText(j, 'อัปโหลดไฟล์ไม่สำเร็จ'));
        }catch(x){ toast('อัปโหลดไฟล์ไม่สำเร็จ'); }
      }
    });
  });
  draw();
  box.el = [thumbs, flist, h('div', {class:'row'}, pickImg, pickFile), h('p', {class:'small muted', text:'รูปไม่เกิน ' + MAX_IMG + ' รูป · ไฟล์ไม่เกิน ' + MAX_FILES + ' ไฟล์ ไฟล์ละไม่เกิน ' + MAX_FILE_MB + ' MB (PDF, Word, Excel, PowerPoint, TXT, CSV, ZIP, JPG, PNG)'}), imgIn, fileIn];
  return box;
}
function resize(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onerror = reject;
    r.onload = function(){
      var im = new Image();
      im.onerror = reject;
      im.onload = function(){
        var s = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

var REDUCED = false; try{ REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
/* numbers in the side panel and the owner's tiles count up from 0 when a view first shows */
function countUp(root){
  if(REDUCED) return;
  root.querySelectorAll('.side button b, .tile b').forEach(function(el){
    var to = parseInt(el.textContent, 10); if(!(to > 0)) return;
    var t0 = performance.now(), dur = 600;
    el.textContent = '0';
    (function step(t){ var k = Math.min(1, (t - t0) / dur); el.textContent = String(Math.round(to * (1 - Math.pow(1 - k, 3)))); if(k < 1) requestAnimationFrame(step); else el.textContent = String(to); })(t0);
  });
}

var lastView = '';
function render(){
  var app = $('#app'); app.replaceChildren();
  // entry animation only when the view changes (login, tab, sub-tab), not on every refresh after an action
  var view = [S.role, S.tabM, S.tabO, S.subM].join('|');
  app.classList.toggle('enter', view !== lastView && !REDUCED);
  var fresh = view !== lastView; lastView = view;
  if(!S.token){ app.appendChild(loginView()); return; }
  app.appendChild(h('div', {class:'bar'},
    h('div', {}, h('h1', {text:'รายงานสถานะโปรเจกต์'}), h('p', {class:'muted greet', text:'สวัสดี คุณ' + (S.name || '') + ' ขอให้เป็นวันที่ดี'})),
    h('div', {class:'row'},
      S.role !== 'admin' ? (function(){ var b = h('button', {class:'btn', text:'รีเฟรช'}); b.addEventListener('click', function(){ withBusy(b, 'กำลังโหลด...', refresh); }); return b; })() : null,
      h('button', {class:'btn', text:'ออกจากระบบ', onclick:function(){ call({action:'logout'}).catch(function(){}); logoutLocal(); }}))));
  if(S.role === 'admin') app.appendChild(adminView());
  else {
    var al = workAlerts(), bar = alertBar(al);
    if(bar) app.appendChild(bar);
    app.appendChild(S.role === 'owner' ? ownerView(al) : managerView(al));
  }
  if(fresh) countUp(app);
  redrawDetail();
}

async function refresh(){
  if(S.role === 'admin'){
    var both = await Promise.all([call({action:'people'}), call({action:'adminProjects'})]);
    if(both[0].ok) S.people = both[0].people;
    if(both[1].ok) S.adminProjects = both[1].projects;
    render(); return;

function dueItems(p){

/* Ask "are you sure?" inside the page, right after the button. The browser's own confirm() is not used:
   some browsers (e.g. the browser pane in the Claude app) close it on their own, so the action never ran. */
function askInline(anchor, msg, yesText, onYes){
  var next = anchor.nextElementSibling;
  if(next && next.classList.contains('ask')) return;
  var yes = h('button', {class:'btn sm danger', type:'button', text:yesText});
  var no = h('button', {class:'btn sm', type:'button', text:'ไม่ใช่'});
  var box = h('div', {class:'ask', role:'alertdialog', 'aria-label':msg}, h('p', {class:'small', text:msg}), h('div', {class:'row'}, yes, no));
  no.addEventListener('click', function(){ box.remove(); anchor.disabled = false; anchor.focus(); });
  yes.addEventListener('click', function(){ onYes(yes); });
  anchor.disabled = true;
  anchor.insertAdjacentElement('afterend', box);
  yes.focus();
}

        catch(x){ toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง'); }

}

    });
    if(msgs.length) box.appendChild(h('p', {class:'small muted', text:'ข้อความที่รับทราบแล้วเกิน ' + DAY7 + ' วันจะไม่แสดงที่นี่ ดูย้อนหลังได้ที่คอมเมนต์ในการ์ดโปรเจกต์'}));
  } else if(S.tabM === 'fix'){
    box.appendChild(h('p', {class:'muted small', text:'โปรเจกต์ที่เจ้าของบริษัทส่งกลับให้แก้ แก้ไขแล้วติ๊ก "ส่งขออนุมัติใหม่" โปรเจกต์จะกลับไปอยู่ในแท็บ "โปรเจกต์ของฉัน"'}));

    function dlKey(p){ return p.deadline || '9999-99-99'; }
    var sorted = shown.slice().sort(function(a, b){ return ORDER.indexOf(keyOf(a)) - ORDER.indexOf(keyOf(b)) || (dlKey(a) < dlKey(b) ? -1 : dlKey(a) > dlKey(b) ? 1 : 0); });
    col.appendChild(h('div', {class:'cards'}, sorted.map(function(p){ return projectCard(p, true); })));
    function side(k){ return function(){ S.sideM = S.sideM === k ? '' : k; S.subM = 'all'; render(); }; }

      {label:'เกินกำหนด', n:al.late.length, cls:'late', go:goLate},
      {label:'ครบกำหนดวันนี้/พรุ่งนี้', n:al.soon.length, cls:'risk', go:goLate},
      {label:'ติดปัญหา', n:mineList.filter(hasProblem).length, cls:'late', on:S.sideM === 'problem', go:side('problem')},

    ]), col));
  }
  return box;
}

/* Hand over the main responsibility: used by the current owner (project form) and by the admin page.
   Nothing changes until the chosen manager accepts. */
function handoverBox(pid, pname, ownerName, pendingName, candidates, afterDone){
  if(pendingName){
    return h('div', {}, h('p', {class:'small warn', text:'รอ ' + pendingName + ' ยอมรับการโอน'}),
      actBtn('ยกเลิกการโอน', 'sm', 'กำลังบันทึก...', async function(){ var j = await call({action:'handoverCancel', id:pid}); if(j.ok) afterDone(); return j; }));
  }
  var sel = h('select', {'aria-label':'ผู้รับโอนโปรเจกต์ ' + pname}, h('option', {value:'', text:'เลือกผู้รับโอน'}),
    candidates.map(function(m){ return h('option', {value:m.id, text:m.name}); }));
  var go = h('button', {class:'btn sm', type:'button', text:'ขอโอน'});
  go.addEventListener('click', function(){
    if(!sel.value){ toast('เลือกผู้รับโอนก่อน'); return; }
    var nm = sel.options[sel.selectedIndex].text;
    var to = sel.value;
    askInline(go, 'ขอโอนโปรเจกต์ "' + pname + '" ให้ ' + nm + '? เมื่อ ' + nm + ' กดรับโอน ' + ownerName + ' จะไม่เห็นและแก้โปรเจกต์นี้อีก (เว้นแต่ถูกเชิญเป็นผู้ร่วม) และ ' + nm + ' จะมีสิทธิ์ลบโปรเจกต์ได้', 'ยืนยันขอโอน', function(yes){
      withBusy(yes, 'กำลังบันทึก...', async function(){
        var j = await call({action:'handoverOffer', id:pid, to:to});
        if(j.ok){ afterDone(); toast('ส่งคำขอโอนแล้ว รอ ' + nm + ' ยอมรับ'); await refresh(); } else toast(errText(j, 'โอนไม่สำเร็จ'));
      });
    });
  });
  return h('div', {class:'row'}, sel, go);
}

function ownerTools(p){
  var box = h('div', {style:'display:flex;flex-direction:column;gap:10px'});
  if(p.approval && p.approval.state === 'pending'){
    box.appendChild(h('div', {class:'row'},
      actBtn('อนุมัติ', 'sm primary', 'กำลังบันทึก...', function(){ return call({action:'approve', id:p.id}); }),
      h('button', {class:'btn sm', text:'ส่งกลับให้แก้', onclick:function(){ returnDialog(p); }})));
  }
  var ta = h('textarea', {maxlength:1000, placeholder:'เขียนคอมเมนต์ถึงผู้จัดการโปรเจกต์นี้ ใส่ @ชื่อ หรือ @ALL ถ้าต้องการให้กดรับทราบ', 'aria-label':'คอมเมนต์', style:'min-height:64px'});
  // People who can be @mentioned: the main responsible person and accepted co-owners.
  var people = [{id:p.ownerId, name:(S.managers.filter(function(m){ return m.id === p.ownerId; })[0] || {}).name || p.ownerName}]
    .concat((p.coOwners || []).filter(function(c){ return c.state === 'accepted'; }).map(function(c){ return {id:c.id, name:c.name}; }));
  function insert(tag){
    var a = ta.selectionStart, b = ta.selectionEnd, v = ta.value, pre = a > 0 && v.charAt(a - 1).trim() !== '' ? ' ' : '';
    ta.value = v.slice(0, a) + pre + tag + ' ' + v.slice(b);
    var pos = a + pre.length + tag.length + 1; ta.focus(); ta.setSelectionRange(pos, pos);
  }
  var chips = h('div', {class:'row', 'aria-label':'แท็กผู้รับ'},
    h('button', {class:'btn sm', type:'button', text:'@ALL', onclick:function(){ insert('@ALL'); }}),
    people.map(function(m){ return h('button', {class:'btn sm', type:'button', text:'@' + m.name, onclick:function(){ insert('@' + m.name); }}); }));
  // Longest names first, so "@สมชาย ใหม่" is not also read as "@สมชาย".
  function targetsOf(text){
    if(/@all(?![a-z0-9])/i.test(text)) return 'all';
    var rest = text, ids = [];
    people.slice().sort(function(x, y){ return y.name.length - x.name.length; }).forEach(function(m){
      var tag = '@' + m.name;
      if(rest.indexOf(tag) >= 0){ ids.push(m.id); rest = rest.split(tag).join(' '); }
    });
    return ids; // [] = no tag: a plain comment, nobody has to acknowledge
  }
  var cimgs = [], thumbs = h('div', {class:'thumbs'});
  function drawThumbs(){ thumbs.replaceChildren.apply(thumbs, cimgs.map(function(id, i){ return thumbEl(id, true, function(){ cimgs.splice(i, 1); drawThumbs(); }); })); }
  var files = h('input', {type:'file', accept:'image/*', multiple:true, hidden:true});
  var pick = h('button', {class:'btn sm', type:'button', text:'แนบรูป'});
  pick.addEventListener('click', function(){ files.click(); });
  files.addEventListener('change', function(){
    var list = Array.prototype.slice.call(files.files); files.value = '';
    withBusy(pick, 'กำลังอัปโหลด...', async function(){
      for(var i = 0; i < list.length; i++){
        if(cimgs.length >= MAX_IMG){ toast('แนบรูปได้ไม่เกิน ' + MAX_IMG + ' รูป'); break; }
        try{
          var b64 = await resize(list[i]);
          var j = await call({action:'upload', data:b64});
          if(j.ok){ imgCache[j.id] = {d:'data:image/jpeg;base64,' + b64, t:Date.now()}; cimgs.push(j.id); drawThumbs(); } else toast('อัปโหลดรูปไม่สำเร็จ');
        }catch(x){ toast('อัปโหลดรูปไม่สำเร็จ'); }
      }
    });
  });
  var send = h('button', {class:'btn sm', type:'button', text:'ส่งคอมเมนต์'});
  send.addEventListener('click', function(){
    if(!ta.value.trim()){ toast('พิมพ์คอมเมนต์ก่อน'); return; }
    var to = targetsOf(ta.value);
    withBusy(send, 'กำลังส่ง...', async function(){
      try{ var j = await call({action:'addComment', id:p.id, text:ta.value, to:to, images:cimgs}); if(j.ok){ toast('ส่งคอมเมนต์แล้ว'); await refresh(); } else toast(errText(j, 'ส่งไม่สำเร็จ')); }
      catch(x){ toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง'); }
    });
  });
  box.appendChild(h('div', {class:'field'}, chips, ta, thumbs, files,
    h('div', {class:'row'}, send, pick, h('span', {class:'small muted', text:'ไม่ใส่ @ = คอมเมนต์ทั่วไป ไม่ต้องรับทราบ · ส่งแล้วแก้ไขไม่ได้ (ลบได้)'}))));
  return box;
}

    var c = curStep(p); if(c && modeOf(p) === 'steps' && c.approval.state === 'pending') workPending.push({p:p, kind:'step', id:c.sid, title:'ขั้นที่ ' + (p.currentStep + 1) + ': ' + c.title, report:c.request || null, parts:c.assignees});

    {label:'ไม่อัปเดตเกิน ' + STALE_DAYS + ' วัน', n:all.filter(isStale).length, cls:'risk', on:S.sideO === 'stale', go:sideO('stale')}
  ]), box));
  var counts = {pending:0, fix:0}; ORDER.forEach(function(k){ counts[k] = 0; });
  var reportedBy = {}; all.forEach(function(p){ counts[bucket(p)]++; reportedBy[p.ownerId] = true; });
  var stale = all.filter(isStale).length;
  box.appendChild(h('div', {class:'tiles'},
    h('button', {class:'tile' + (S.filterStatus === '' ? ' on' : ''), onclick:function(){ S.filterStatus = ''; render(); }}, h('span', {class:'muted small', text:'ทั้งหมด'}), h('b', {text:String(all.length)})),
    ['pending', 'fix'].concat(ORDER).map(function(k){ var d = BK[k] || ST[k]; return h('button', {class:'tile ' + d.cls + (S.filterStatus === k ? ' on' : ''), onclick:function(){ S.filterStatus = S.filterStatus === k ? '' : k; render(); }}, h('span', {class:'small', text:d.label}), h('b', {text:String(counts[k])})); })));
  if(stale) box.appendChild(h('p', {class:'warn', text:'มี ' + stale + ' โปรเจกต์ที่ไม่อัปเดตเกิน ' + STALE_DAYS + ' วัน'}));
  var overdue = all.filter(isOverdue).length;
  if(overdue || S.filterLate) box.appendChild(h('div', {class:'row'},
    h('span', {class:'warn', text:'มี ' + overdue + ' โปรเจกต์เกินกำหนดเสร็จ'}),
    h('button', {class:'btn sm', type:'button', text:S.filterLate ? 'แสดงทั้งหมด' : 'ดูเฉพาะที่เกินกำหนด', onclick:function(){ S.filterLate = !S.filterLate; render(); }})));
  var reported = S.managers.filter(function(m){ return reportedBy[m.id]; }).length;
  box.appendChild(h('p', {class:'muted small', text:'ผู้จัดการที่รายงานแล้ว ' + reported + ' จาก ' + S.managers.length + ' คน'}));
  function chip(label, val){ return h('button', {class:'chip' + (S.filterMgr === val ? ' on' : ''), onclick:function(){ S.filterMgr = val; render(); }, text:label}); }
  box.appendChild(h('div', {class:'chips'}, chip('ทุกคน', ''), S.managers.map(function(m){ return chip(m.name, m.id); })));
  function ofMgr(p, id){ return p.ownerId === id || (p.coOwners || []).some(function(c){ return c.id === id && c.state === 'accepted'; }); }
  if(S.sideO) box.appendChild(h('div', {class:'row'}, h('span', {class:'small', text:'แสดงเฉพาะ: ' + (S.sideO === 'problem' ? 'ติดปัญหา' : 'ไม่อัปเดตเกิน ' + STALE_DAYS + ' วัน')}),
    h('button', {class:'btn sm', type:'button', text:'แสดงทั้งหมด', onclick:function(){ S.sideO = ''; render(); }})));
  var list = all.filter(function(p){ return (!S.filterStatus || bucket(p) === S.filterStatus) && (!S.filterMgr || ofMgr(p, S.filterMgr)) && (!S.filterLate || isOverdue(p))
      && (S.sideO !== 'problem' || hasProblem(p)) && (S.sideO !== 'stale' || isStale(p)); })
    .sort(function(a, b){ return ORDER.indexOf(keyOf(a)) - ORDER.indexOf(keyOf(b)) || new Date(b.updatedAt) - new Date(a.updatedAt); });
  box.appendChild(list.length ? h('div', {class:'cards'}, list.map(function(p){ return projectCard(p, false); })) : h('p', {class:'muted', text:'ไม่มีโปรเจกต์ตามตัวกรองนี้'}));
  return outer;
}

/* ---------- admin ---------- */
function adminView(){
  var box = h('div', {style:'display:flex;flex-direction:column;gap:14px'});
  box.appendChild(h('h2', {text:'จัดการชื่อและรหัส'}));
  box.appendChild(h('p', {class:'muted small', text:'ชื่อผู้ใช้ = ใช้เข้าสู่ระบบ (อังกฤษพิมพ์เล็กและตัวเลข 3–20 ตัว) ชื่อที่แสดง = ชื่อไทยที่คนเห็นในโปรเจกต์ การแก้ชื่อที่แสดงไม่เปลี่ยนชื่อในโปรเจกต์ที่สร้างไปแล้ว ถ้าแก้ชื่อผู้ใช้ของใคร คนนั้นต้องเข้าสู่ระบบใหม่ด้วยชื่อใหม่ รหัสไม่เก็บตัวจริง ดูรหัสเดิมไม่ได้ ตั้งใหม่ได้เท่านั้น (อย่างน้อย 6 ตัว)'}));
  var rows = S.people.map(function(p){
    var uid = h('input', {type:'text', value:p.id, maxlength:20, 'aria-label':'ชื่อผู้ใช้ของ ' + p.name, autocapitalize:'none', style:'min-width:110px'}); cleanId(uid);
    var nm = h('input', {type:'text', value:p.name, maxlength:60, 'aria-label':'ชื่อที่แสดงของ ' + p.id, style:'min-width:120px'});
    var saveName = h('button', {class:'btn sm', type:'button', text:'บันทึกชื่อ'});
    saveName.addEventListener('click', function(){
      withBusy(saveName, 'กำลังบันทึก...', async function(){
        var j = await call({action:'updatePerson', id:p.id, newId:uid.value, newName:nm.value});
        if(j.ok){ toast('บันทึกชื่อแล้ว'); if(p.id === S.id && uid.value !== p.id){ logoutLocal(); toast('เปลี่ยนชื่อผู้ใช้ของคุณแล้ว กรุณาเข้าสู่ระบบใหม่'); } else await refresh(); }
        else toast(errText(j, 'บันทึกชื่อไม่สำเร็จ'));
      });
    });
    var pw = pwField({placeholder:'ตั้งรหัสใหม่', autocomplete:'new-password', 'aria-label':'รหัสใหม่ของ ' + p.name, style:'min-width:150px'});
    var savePw = h('button', {class:'btn sm', type:'button', text:'บันทึกรหัส'});
    savePw.addEventListener('click', function(){
      if(pw.input.value.length < 6){ toast(ERR.short); return; }
      withBusy(savePw, 'กำลังบันทึก...', async function(){
        var j = await call({action:'setPass', id:p.id, pass:pw.input.value});
        if(j.ok){ pw.input.value = ''; toast('ตั้งรหัสของ ' + p.name + ' แล้ว'); await refresh(); } else toast(errText(j, 'ตั้งรหัสไม่สำเร็จ'));
      });
    });
    return h('tr', {},
      h('td', {}, h('div', {class:'field'}, uid, nm, saveName)),
      h('td', {text:ROLE[p.role] || p.role}),
      h('td', {text:p.hasPass ? 'ตั้งแล้ว' : 'ยังไม่ตั้ง', class:p.hasPass ? '' : 'warn'}),
      h('td', {}, h('div', {class:'field'}, pw.el, savePw)),
      h('td', {}, p.role === 'admin' ? null : (function(){
        var b = h('button', {class:'btn sm', type:'button', text:p.active ? 'ปิดการใช้งาน' : 'เปิดการใช้งาน'});
        b.addEventListener('click', function(){ withBusy(b, 'กำลังบันทึก...', async function(){ var j = await call({action:'setActive', id:p.id, active:!p.active}); if(j.ok) await refresh(); else toast(errText(j, 'ไม่สำเร็จ')); }); });
        return b;
      })()));
  });
  box.appendChild(h('div', {class:'card', style:'overflow-x:auto'}, h('table', {}, h('thead', {}, h('tr', {}, ['ชื่อผู้ใช้ / ชื่อที่แสดง','บทบาท','รหัส','ตั้งรหัสใหม่','สถานะ'].map(function(t){ return h('th', {text:t}); }))), h('tbody', {}, rows))));
  var nu = h('input', {type:'text', maxlength:20, placeholder:'ชื่อผู้ใช้ (อังกฤษ)', 'aria-label':'ชื่อผู้ใช้ใหม่', autocapitalize:'none'}); cleanId(nu);
  var nn = h('input', {type:'text', maxlength:60, placeholder:'ชื่อที่แสดง (ไทย)', 'aria-label':'ชื่อที่แสดงของผู้จัดการใหม่'});
  var add = h('button', {class:'btn primary', type:'button', text:'เพิ่ม'});
  add.addEventListener('click', function(){
    if(!nu.value || !nn.value.trim()){ toast(ERR.missing); return; }
    withBusy(add, 'กำลังเพิ่ม...', async function(){
      var j = await call({action:'addPerson', username:nu.value, name:nn.value});
      if(j.ok){ nu.value = ''; nn.value = ''; toast('เพิ่มแล้ว ตั้งรหัสในตารางด้านบน'); await refresh(); } else toast(errText(j, 'ไม่สำเร็จ'));
    });
  });
  box.appendChild(h('div', {class:'card'}, h('h3', {text:'เพิ่มผู้จัดการ'}), h('div', {class:'row'}, nu, nn, add)));
  var mgrs = S.people.filter(function(q){ return q.role === 'manager' && q.active; });
  box.appendChild(h('div', {class:'card'}, h('h3', {text:'โอนผู้รับผิดชอบหลักของโปรเจกต์'}),
    h('p', {class:'muted small', text:'ใช้เมื่อผู้รับผิดชอบหลักไม่อยู่แล้ว หรือต้องย้ายงาน ผู้รับโอนต้องกดรับโอนเองในหน้าของเขา เจ้าของเดิมจะไม่เห็นโปรเจกต์นี้อีกหลังรับโอน หน้านี้เห็นแค่ชื่อโปรเจกต์ ไม่เห็นรายละเอียด'}),
    S.adminProjects.length ? S.adminProjects.map(function(pr){
      return h('div', {class:'field', style:'border-top:1px solid var(--line);padding-top:10px'},
        h('p', {}, h('b', {text:pr.name}), ' · ผู้รับผิดชอบหลัก: ' + pr.ownerName),
        handoverBox(pr.id, pr.name, pr.ownerName, pr.handoverTo, mgrs.filter(function(m){ return m.id !== pr.ownerId; }), function(){}));
    }) : h('p', {class:'muted', text:'ยังไม่มีโปรเจกต์'})));
  return box;
}

/* ---------- start ---------- */
(function(){
  try{
    var s = JSON.parse(sessionStorage.getItem('ps-s') || 'null');
    if(s && s.token){ S.token = s.token; S.id = s.id; S.name = s.name; S.role = s.role; if(S.role !== 'admin') skeleton(); refresh(); return; }
  }catch(e){}
  render();
})();
</script>
